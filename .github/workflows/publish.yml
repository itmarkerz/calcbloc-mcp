# Stages a new npm version when a version tag (v0.1.1, ...) is pushed.
# npm trusted publishing for this package is stage-only: this run uploads the version to npm's staging
# area, and nothing is public until a maintainer approves it on npmjs.com (package > Staged Packages >
# Approve, with 2FA) or with `npm stage approve <stage-id>`.
# After approving, run the "MCP Registry" workflow (registry.yml) to publish server.json.
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); provenance is generated automatically
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check versions match the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          srv="$(node -p "require('./server.json').version")"
          srvpkg="$(node -p "require('./server.json').packages[0].version")"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$srv" ] || [ "$tag" != "$srvpkg" ]; then
            echo "Tag $tag, package.json $pkg, server.json $srv / $srvpkg must all match"; exit 1
          fi

      - name: Use npm 11.15 or newer (needed for staged publishing)
        run: |
          set -euo pipefail
          v="$(npm -v)"
          if ! node -e 'const [a, b] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && b >= 15) ? 0 : 1)' "$v"; then
            npm install -g npm@11
          fi
          npm -v

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Stage on npm
        run: npm stage publish

      - name: Next steps
        run: |
          {
            echo "### calcbloc-mcp ${GITHUB_REF_NAME} is staged on npm"
            echo
            echo "1. Approve it: https://www.npmjs.com/package/calcbloc-mcp (Staged Packages > Approve, with 2FA)."
            echo "2. Then run the **MCP Registry** workflow (Actions > MCP Registry > Run workflow)."
          } >> "$GITHUB_STEP_SUMMARY"
