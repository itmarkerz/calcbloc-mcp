name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Coverage text matches the API capture (no typed-in counts)
        run: npm run coverage:check
      - run: npm run build
      - name: Schema tests (tool descriptions, enums, region requirement)
        run: npm run test:schema
      - name: Golden tests (official-figure cases)
        run: npm run test:golden
      - run: npm test
